{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'myapp/css/shared.css' %}">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="{% static 'myapp/head logo.png' %}" />
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
    <title>Sign In — Zanchangemakers</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --navy: #1C2E5E;
            --navy-deep: #0F1A36;
            --crimson: #A51C30;
            --gold: #F5C300;
            --ink2: #4A5879;
            --bg: #F5F7FC;
            --white: #ffffff;
            --form-bg: #E1EDF7;
            --text-purple: #6A1B51;
            --border: rgba(28, 46, 94, 0.09);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .page-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .page-card {
            background: var(--white);
            width: 100%;
            max-width: 440px;
            padding: 45px 40px;
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 14px 34px rgba(28, 46, 94, 0.10);
            text-align: center;
        }

        .brand-mark { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 22px; text-decoration: none; }
        .brand-mark img { height: 40px; width: auto; }
        .brand-mark span { font-family: 'Barlow Condensed', sans-serif; font-size: 1.15rem; font-weight: 800; color: var(--navy-deep); letter-spacing: 0.4px; }

        .m-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--navy);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .m-sub { color: var(--ink2); font-size: 0.9rem; margin-bottom: 25px; }

        .form-block { text-align: left; background-color: var(--form-bg); margin-bottom: 3px; padding: 12px 20px; border-radius: 6px; }
        .form-block label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-purple); margin-bottom: 4px; letter-spacing: 0.5px; }
        .field-row { display: flex; align-items: center; gap: 8px; }
        .field-txt { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 0.95rem; color: #444; padding: 2px 0; outline: none; }
        .field-txt::placeholder { color: #8DA9C4; }
        .toggle-pw { border: none; background: transparent; color: var(--ink2); cursor: pointer; font-size: 0.9rem; flex-shrink: 0; }
        .toggle-pw:hover { color: var(--navy); }

        .field-meta { display: flex; justify-content: flex-end; margin: 8px 2px 4px; }
        .field-meta a { font-size: 0.8rem; color: var(--ink2); text-decoration: none; }
        .field-meta a:hover { color: var(--crimson); text-decoration: underline; }

        .m-err {
            color: var(--crimson);
            background: rgba(165,28,48,0.06);
            border: 1px solid rgba(165,28,48,0.15);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 14px;
            text-align: left;
        }
        .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: var(--navy);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 0.5px;
            margin-top: 14px;
        }
        .btn-submit:hover { background: var(--crimson); }
        .m-switch { font-size: 0.88rem; margin-top: 20px; color: #666; }
        .m-switch a { color: var(--crimson); font-weight: 600; text-decoration: none; cursor: pointer; }
        .m-switch a:hover { text-decoration: underline; }

        @media (max-width: 560px) {
            .page-wrapper { padding: 24px 16px; align-items: flex-start; }
            .page-card { padding: 32px 22px; border-radius: 12px; }
            .m-title { font-size: 1.75rem; }
            .btn-submit { min-height: 48px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="page-card">
            <a href="/" class="brand-mark">
                <img src="{% static 'myapp/head logo.png' %}" alt="Zanchangemakers Logo">
                <span>Zanchangemakers</span>
            </a>

            <form id="authForm">
                <h2 class="m-title">Sign In</h2>
                <p class="m-sub">Sign in to your dashboard to manage your volunteering tracks</p>

                <div id="loginError" class="m-err" style="display:none"></div>

                <div class="form-block">
                    <label for="loginEmail">Email Address</label>
                    <input class="field-txt" id="loginEmail" type="email" placeholder="Type here" autocomplete="email" required />
                </div>

                <div class="form-block">
                    <label for="loginPassword">Password</label>
                    <div class="field-row">
                        <input class="field-txt" id="loginPassword" type="password" placeholder="Type here" autocomplete="current-password" required />
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field-meta">
                    <a href="{% url 'password_reset' %}">Forgot password?</a>
                </div>

                <button type="submit" id="loginBtn" class="btn-submit">Log In <i class="fa-solid fa-arrow-right"></i></button>
            </form>

            <div class="m-switch" id="authSwitch">New volunteer? <a href="{% url 'register' %}">Register here</a></div>
        </div>
    </div>

    <script>
        (function () {
            const btn = document.getElementById('togglePw');
            const input = document.getElementById('loginPassword');
            if (btn && input) {
                btn.addEventListener('click', function () {
                    const isHidden = input.type === 'password';
                    input.type = isHidden ? 'text' : 'password';
                    btn.querySelector('i').className = isHidden ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
                });
            }
            document.getElementById('authForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                const errEl = document.getElementById('loginError');
                const btn = document.getElementById('loginBtn');
                btn.disabled = true; btn.textContent = 'Signing in...';
                try {
                    const res = await fetch('/api/auth/login/', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password }),
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setTokens(data.access, data.refresh, data.user);
                        window.location.href = getPostLoginRedirect(data.user);
                    } else {
                        errEl.textContent = data.non_field_errors ? data.non_field_errors[0] : 'Invalid email or password.';
                        errEl.style.display = 'block';
                    }
                } catch (e) {
                    errEl.textContent = 'Network error. Please try again.';
                    errEl.style.display = 'block';
                }
                btn.disabled = false; btn.innerHTML = 'Log In <i class="fa-solid fa-arrow-right"></i>';
            });
        })();
    </script>
    <script id="django-urls-data" type="application/json">{"home": "/", "about": "/about/", "programs": "/programs/", "volunteer": "/volunteer/", "gallery": "/gallery/", "stories": "/stories/", "contact": "/contact/", "register": "/register/", "login": "/login/", "donate": "/donate/"}</script>
    <script src="{% static 'myapp/js/shared.js' %}"></script>
</body>
</html>
