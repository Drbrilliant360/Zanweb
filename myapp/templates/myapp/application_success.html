{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'myapp/css/shared.css' %}">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="{% static 'myapp/head logo.png' %}" />
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
    <title>Application Submitted — Zanchangemakers</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --navy: #1C2E5E; --navy-deep: #0F1A36; --crimson: #A51C30;
            --gold: #F5C300; --ink2: #4A5879; --bg: #F5F7FC; --white: #ffffff;
            --border: rgba(28,46,94,0.09);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .page-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .page-card {
            background: var(--white);
            width: 100%; max-width: 480px;
            padding: 50px 40px;
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 14px 34px rgba(28,46,94,0.10);
            text-align: center;
        }
        .success-icon {
            font-size: 3.5rem; color: #22c55e;
            margin-bottom: 16px;
        }
        .m-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2rem; font-weight: 900;
            text-transform: uppercase;
            color: var(--navy);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .m-sub { color: var(--ink2); font-size: 0.95rem; margin-bottom: 30px; line-height: 1.6; }
        .btn-home {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 32px;
            background: var(--navy); color: var(--white);
            border: none; border-radius: 6px;
            font-weight: 700; font-size: 0.95rem; cursor: pointer;
            text-decoration: none; transition: background 0.2s;
        }
        .btn-home:hover { background: var(--crimson); }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="page-card">
            <div class="success-icon"><i class="fa-regular fa-circle-check"></i></div>
            <h1 class="m-title">Application Submitted!</h1>
            <p class="m-sub">Thank you for your interest in volunteering with Zanchangemakers. Our team will review your application and get back to you soon.</p>
            <a href="/" class="btn-home"><i class="fa-solid fa-house"></i> Back to Home</a>
        </div>
    </div>
    <script src="{% static 'myapp/js/shared.js' %}"></script>
</body>
</html>
