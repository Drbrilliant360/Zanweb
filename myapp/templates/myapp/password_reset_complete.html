{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'myapp/css/shared.css' %}">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="{% static 'myapp/head logo.png' %}" />
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
    <title>Password Reset Complete — Zanchangemakers</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --navy: #1C2E5E; --navy-deep: #0F1A36; --crimson: #A51C30; --gold: #F5C300; --ink2: #4A5879; --bg: #F5F7FC; --white: #ffffff; --border: rgba(28,46,94,0.09); }
        body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; }
        .page-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .page-card { background: var(--white); width: 100%; max-width: 460px; padding: 45px 40px; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 14px 34px rgba(28,46,94,0.10); text-align: center; }
        .icon { font-size: 3rem; color: #22c55e; margin-bottom: 16px; }
        .m-title { font-family: 'Barlow Condensed', sans-serif; font-size: 2rem; font-weight: 900; text-transform: uppercase; color: var(--navy); letter-spacing: 0.5px; margin-bottom: 10px; }
        .m-sub { color: var(--ink2); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.6; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: var(--navy); color: var(--white); border: none; border-radius: 6px; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-decoration: none; }
        .btn:hover { background: var(--crimson); }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="page-card">
            <div class="icon"><i class="fa-regular fa-circle-check"></i></div>
            <h1 class="m-title">Password Reset Complete</h1>
            <p class="m-sub">Your password has been successfully reset. You can now sign in with your new password.</p>
            <a href="{% url 'login' %}" class="btn"><i class="fa-solid fa-arrow-right"></i> Sign In</a>
        </div>
    </div>
    <script src="{% static 'myapp/js/shared.js' %}"></script>
</body>
</html>
