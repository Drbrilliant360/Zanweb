{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: 'Inter', Arial, sans-serif; background: #F5F7FC; padding: 30px;">
    <div style="max-width: 500px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 35px; text-align: center; border: 1px solid rgba(28,46,94,0.09);">
        <img src="{{ protocol }}://{{ domain }}{% static 'myapp/head logo.png' %}" alt="Zanchangemakers" style="height: 45px; margin-bottom: 18px;">
        <h2 style="font-family: 'Barlow Condensed', sans-serif; color: #1C2E5E; font-size: 1.6rem; margin-bottom: 10px;">Password Reset Request</h2>
        <p style="color: #4A5879; font-size: 0.9rem; margin-bottom: 20px;">You're receiving this email because you requested a password reset for your Zanchangemakers account.</p>
        <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display: inline-block; background: #1C2E5E; color: #ffffff; padding: 12px 28px; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 0.95rem;">Reset Your Password</a>
        <p style="color: #8A9ABE; font-size: 0.78rem; margin-top: 24px;">If you didn't request this, you can safely ignore this email.</p>
    </div>
</body>
</html>
